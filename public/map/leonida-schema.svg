<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Eigene, stark vereinfachte Skizze von Leonida (5-Sterne-Kompass). Nicht maßstabsgetreu,
       nicht von der Spielkarte abgezeichnet. Lage der Regionen nur ungefähr, nach offiziellen Angaben
       und mehreren unabhängigen Quellen (Stand 19.11.2026). -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14123a"/>
      <stop offset="1" stop-color="#1b1446"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2656"/>
      <stop offset="1" stop-color="#241f48"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#9565FF" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="1000" fill="url(#sea)"/>
  <rect width="1000" height="1000" fill="url(#grid)"/>

  <!-- Festland (schematisch) -->
  <path d="M70 150 C160 118 300 112 430 122 C540 130 640 112 735 128 C790 138 812 170 806 220 C800 320 822 410 808 500 C796 580 814 640 792 700 C772 758 738 792 692 812 C662 826 628 822 606 798 C578 766 548 722 512 706 C470 688 436 650 418 600 C398 546 432 490 420 430 C410 372 392 320 366 282 C342 250 290 236 236 240 C176 244 118 240 70 226 C46 214 44 166 70 150 Z"
        fill="url(#land)" stroke="#42E8D5" stroke-opacity="0.45" stroke-width="3"/>

  <!-- Inselkette im Süden (schematisch) -->
  <g fill="url(#land)" stroke="#42E8D5" stroke-opacity="0.45" stroke-width="2">
    <ellipse cx="650" cy="858" rx="30" ry="10" transform="rotate(-18 650 858)"/>
    <ellipse cx="600" cy="884" rx="26" ry="9" transform="rotate(-14 600 884)"/>
    <ellipse cx="552" cy="904" rx="24" ry="8" transform="rotate(-10 552 904)"/>
    <ellipse cx="506" cy="918" rx="20" ry="7" transform="rotate(-6 506 918)"/>
    <ellipse cx="462" cy="928" rx="16" ry="6"/>
  </g>

  <!-- Regionen als weiche Flächen (ungefähre Lage) -->
  <g>
    <circle cx="620" cy="195" r="95" fill="#42E8D5" fill-opacity="0.09"/>
    <circle cx="200" cy="185" r="72" fill="#FF9B68" fill-opacity="0.12"/>
    <circle cx="600" cy="440" r="105" fill="#9565FF" fill-opacity="0.12"/>
    <circle cx="585" cy="690" r="82" fill="#42E8D5" fill-opacity="0.09"/>
    <circle cx="735" cy="640" r="68" fill="#FF55B8" fill-opacity="0.15"/>
    <ellipse cx="560" cy="895" rx="130" ry="45" fill="#42E8D5" fill-opacity="0.06"/>
  </g>

  <text x="610" y="345" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="14" fill="#ffffff" fill-opacity="0.06">LEONIDA</text>

  <!-- Beschriftungen -->
  <g font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#e9e6ff" fill-opacity="0.85" text-anchor="middle">
    <text x="620" y="240">MOUNT KALAGA</text>
    <text x="200" y="230">PORT GELLHORN</text>
    <text x="600" y="485">AMBROSIA</text>
    <text x="585" y="735">GRASSRIVERS</text>
    <text x="735" y="685">VICE CITY</text>
    <text x="560" y="962">LEONIDA KEYS</text>
  </g>

  <!-- Nordpfeil -->
  <g transform="translate(905 120)" fill="#e9e6ff" fill-opacity="0.8">
    <path d="M0 -42 L14 0 L0 -9 L-14 0 Z"/>
    <text y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">N</text>
  </g>

  <text x="40" y="978" font-family="Inter, Arial, sans-serif" font-size="16" fill="#e9e6ff" fill-opacity="0.55">Eigene Skizze · nicht maßstabsgetreu · Lage der Regionen ungefähr · © 5-Sterne-Kompass</text>
</svg>
